*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink)}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em}.brand span{color:var(--accent)}
.mock{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.top .sp{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--self-soft);color:var(--self)}
main{padding:28px clamp(16px,4vw,48px) 60px;max-width:1060px;width:100%;min-width:0;margin:0 auto}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-8px 0 22px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{font-size:11px;width:18px;height:18px;border-radius:99px;display:grid;place-items:center;background:var(--surface2)}
.tabs button.on .n{background:var(--accent);color:var(--accent-ink)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
h1{font-size:clamp(22px,3vw,30px);line-height:1.2;letter-spacing:-.02em;margin-bottom:8px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:15px;margin-bottom:6px}
p.lead{color:var(--muted);max-width:68ch;margin-bottom:18px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.choice{display:block;width:100%;text-align:left;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px}
.choice:hover{border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.lock{opacity:.75}
.choice b{display:block;margin-bottom:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:middle}
.t-src{background:var(--src-soft);color:var(--src)}.t-calc{background:var(--calc-soft);color:var(--calc)}
.t-est{background:var(--est-soft);color:var(--est)}.t-self{background:var(--self-soft);color:var(--self)}
.t-prov{background:none;border:1px dashed var(--self);color:var(--self)}.t-unv{background:var(--surface2);color:var(--muted)}
.t-bad{background:var(--bad-soft);color:var(--bad)}.t-ok{background:var(--ok-soft);color:var(--ok)}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;font-size:14px}
.banner>div{flex:1;min-width:220px}
.b-info{background:var(--src-soft)}.b-warn{background:var(--self-soft)}.b-est{background:var(--est-soft)}.b-bad{background:var(--bad-soft)}.b-ok{background:var(--ok-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;background:var(--surface)}
.chip button{border:0;background:var(--surface2);border-radius:99px;width:20px;height:20px;cursor:pointer;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.o i{background:var(--est)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--bad)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%}
.drop{border:2px dashed var(--line);border-radius:14px;padding:34px;text-align:center;background:var(--surface)}
.spin{width:18px;height:18px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.step .k{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-weight:700;background:var(--surface2)}
.step.done .k{background:var(--ok);color:#fff}
.sdg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fff;padding:3px 9px;border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.heat td{text-align:center;font-weight:600;font-size:12px}
.foot{margin-top:30px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);border-left:3px solid var(--est);padding:4px 10px;margin:12px 0;background:var(--est-soft);border-radius:0 8px 8px 0}
.hint b{color:var(--est)}
details summary{cursor:pointer;font-weight:600;font-size:13.5px}
@media (max-width:820px){
  .mock{display:none}
  .top{flex-wrap:wrap;padding:10px 16px}
  main{padding:20px 16px 50px}
  .hide-m{display:none}
}

};

   desc:'Turns company data into dashboards and reports that guide business decisions.',

   why:{8:'Better decisions from data raise business productivity (8.2).',9:'Builds local analytics capability inside Malaysian firms (9.5).'}},
  {id:'data-analyst',code:'2524-02',title:'Data Analyst',group:'professionals',auto:38,assist:37,sdg:[8,9],
   desc:'Collects, cleans and analyses data, then reports findings to decision-makers.',
   skills:['SQL and databases','Python programming','Data visualisation','Statistics','Using AI tools','Communication'],
   why:{8:'Evidence-based decisions improve productivity (8.2).',9:'Grows the data workforce behind digital industry (9.5).'}},
  {id:'db-assistant',code:'3512-05',title:'Database Assistant',group:'technicians',auto:50,assist:50,sdg:[8],
   desc:'Maintains database records, runs routine queries and supports users.',
   skills:['SQL and databases','Spreadsheets (Excel)','Teamwork','Customer service'],
   why:{8:'Keeps business systems running reliably (8.2).'}},
  {id:'digital-learning',code:'2423-09',title:'Digital Learning Specialist',group:'professionals',auto:17,assist:50,sdg:[4],
   desc:'Designs online training and helps organisations reskill their people.',
   skills:['Communication','Using AI tools','Graphic design','Teamwork'],
   why:{4:'Directly delivers lifelong learning for workers (4.4).'}},
  {id:'digital-transformation',code:'2511-08',title:'Digital Transformation Executive',group:'professionals',auto:0,assist:63,sdg:[8,9],

   skills:['Business process analysis','Project coordination','Data visualisation','Communication','Problem solving'],

];
const SCEN = {moderate:0.6, fast:1.0};       // SCENARIO_FACTOR in src/lib/scoring.js
const CREDIT = {basic:.5, good:.75, strong:1, unknown:.5};
const LEVELS = ['basic','good','strong'];
const QUIZ = {

  'Python programming':[['What does len([3, 5, 7]) return?',['3','15','7'],0],['Which type is immutable?',['list','dict','tuple'],2]],
  'Spreadsheets (Excel)':[['Which feature summarises rows by category?',['Pivot table','Freeze panes','Conditional formatting'],0]],

/* ---------- i18n (interface only; CV language never changes it) ---------- */

 g1:'Entry & access',g2:'Who you are today',g3:'Explore',g4:'Save & return',

const KEY = 'futureready-mockup-v1';
const fresh = () => ({screen:'welcome',lang:'en',access:null,category:null,signedIn:false,

  target:null, progress:{}, saveChoice:null, sync:'local'});
let S;
function load(){ try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Scoring (same maths as src/lib/scoring.js; unknown level = 0.5, not 'strong') ---------- */
function demandOf(group){ return (group==='professionals' && S.demandOverride!=null) ? S.demandOverride : GROUPS[group].demand; }
function score(role, scen = S.scenario){
  const parts = role.skills.map(l => {
    const has = Object.hasOwn(S.profile.skills, l);
    const lv = has ? (S.profile.skills[l] || 'unknown') : null;
    return {l, has, lv, credit: has ? CREDIT[lv] : 0};
  });
  const fit = parts.reduce((a,p)=>a+p.credit,0) / parts.length * 100;
  const demand = demandOf(role.group);
  const autoAdj = role.auto * SCEN[scen];
  const outlook = 0.5*demand + 0.5*(100 - autoAdj);
  const goals = role.sdg.filter(g => S.profile.sdgPref.includes(g));
  const bonus = Math.min(10, 5*goals.length);
  const rank = Math.min(100, 0.6*fit + 0.4*outlook + bonus);
  const provisional = parts.some(p => p.lv==='unknown') || !S.assessed;
  return {parts, fit, demand, autoAdj, outlook, goals, bonus, rank, provisional};
}
const ranked = (scen = S.scenario) => ROLES.map(r => ({r, s:score(r, scen)})).sort((a,b)=>b.s.rank-a.s.rank);
const growth = l => { const [a,b] = SKILLS[l].r; return (b-a)/a*100; };
function priority(l, scen = S.scenario){ // momentum, with AI-linked skills boosted by the scenario factor
  const g = growth(l); return g * (SKILLS[l].ai ? (1 + SCEN[scen]) : 1);
}
const r0 = n => Math.round(n);

      <div style="flex:1;min-width:220px"><div class="tiny muted">#${i+1} · eMASCO ${r.code}</div><h3 style="font-size:17px">${r.title}</h3><p class="small muted">${r.desc}</p></div>
      <div style="min-width:220px">
       <div class="row" style="justify-content:space-between"><span class="small">Current Skill Match ${s.provisional?tag('prov','Provisional'):tag('calc','Calculated')}</span><b>${r0(s.fit)}%</b></div><div class="bar"><i style="width:${s.fit}%"></i></div>
       <div class="row" style="justify-content:space-between;margin-top:8px"><span class="small">Future Outlook ${tag('est','Estimate')}</span><b>${r0(s.outlook)}</b></div><div class="bar o"><i style="width:${s.outlook}%"></i></div>
      </div></div>
      <div class="small" style="margin-top:10px"><b>You have:</b> ${have.map(p=>p.l).join(', ')||'—'}<br><b>To learn:</b> ${gap.map(p=>`<span class="down">${p.l}</span>`).join(', ')||'nothing — full coverage'}</div>
      <div class="small muted" style="margin-top:6px">Why: you cover ${have.length} of ${r.skills.length} required skills; ${GROUP_NAME[r.group].toLowerCase()} wages grew ${GROUPS[r.group].growth}% (2020→25)${s.goals.length?'; matches your interest in '+s.goals.map(g=>'SDG '+g).join(', '):''}.</div>
      <div class="row" style="margin-top:10px">${r.sdg.map(sdgB).join('')}<span class="sp" style="flex:1"></span><button class="btn sm" onclick="S.viewRole='${r.id}';go('role')">Why this score?</button><button class="btn sm pri" onclick="setTarget('${r.id}')">${t('setTarget')}</button></div></div>`;
  }).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="go('confirm')">Edit my skills</button><button class="btn" onclick="go('assess')">Update proficiency</button></div>
  ${hint('Stage 3 of 6. Every number has a breakdown on “Why this score?”. AI supports the choice; it never decides for the user.')}`;
};
function setTarget(id){ S.target=id; go('roadmap'); }

V.role = () => {
  const r = ROLES.find(x=>x.id===(S.viewRole||S.target||'bi-analyst')), s = score(r);
  const best = s.parts.filter(p=>p.credit<1).map(p=>({p, gain:(1-p.credit)/s.parts.length*100})).sort((a,b)=>b.gain-a.gain);
  return `<div class="crumb"><a href="#" onclick="go('match');return false">← ${t('match')}</a></div>
  <h1>${r.title}</h1><p class="lead">${r.desc} ${SRC('emasco')}</p>
  ${provBanner()}
  <div class="grid g2">
   <div class="card"><h3>Current Skill Match = ${r0(s.fit)}% ${s.provisional?tag('prov','Provisional'):tag('calc','Calculated')}</h3>
    <p class="tiny muted">Average credit across the ${r.skills.length} required skills. Credit: strong 100% · good 75% · basic 50% · unknown 50% · missing 0%.</p>
    <table><tr><th>Required skill</th><th>Your level</th><th class="num">Credit</th></tr>
    ${s.parts.map(p=>`<tr><td>${p.l}</td><td>${p.has?(p.lv==='unknown'?tag('prov','unknown'):S.levelSrc[p.l]==='quiz'?tag('calc',p.lv):tag('self',p.lv)):tag('bad','missing')}</td><td class="num">${r0(p.credit*100)}%</td></tr>`).join('')}</table></div>
   <div class="card"><h3>Future Outlook = ${r0(s.outlook)} ${tag('est','Estimate')}</h3>
    <table><tr><td>Demand (${GROUP_NAME[r.group]})</td><td class="num">${r0(s.demand)}</td><td class="tiny">${S.demandOverride!=null&&r.group==='professionals'?tag('self','edited'):tag('src','OpenDOSM')}</td></tr>
    <tr><td>Automatable tasks × scenario ${SCEN[S.scenario]}</td><td class="num">${r.auto}% → ${r0(s.autoAdj)}%</td><td class="tiny">${tag('src','eMASCO tasks')}</td></tr>
    <tr><td colspan="3" class="tiny muted">Outlook = 0.5 × demand + 0.5 × (100 − automatable)</td></tr></table>
    <h3 style="margin-top:14px">Rank score = ${r0(s.rank)}</h3><p class="tiny muted">0.6 × match (${r0(s.fit)}) + 0.4 × outlook (${r0(s.outlook)}) + SDG interest bonus (${s.bonus})</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>What would raise your match?</h3>
   ${best.slice(0,3).map(b=>`<div class="row small" style="padding:6px 0;border-bottom:1px solid var(--line);justify-content:space-between"><span>${b.p.has?'Prove or improve':'Learn'} <b>${b.p.l}</b> (${SKILLS[b.p.l].h} h)</span><span class="up">+${r0(b.gain)} points → ${r0(s.fit+b.gain)}%</span></div>`).join('')}
  </div>
  <div class="card" style="margin-top:14px"><h3>SDG links for this role</h3>${r.sdg.map(g=>`<p class="small" style="margin:6px 0">${sdgB(g)} ${r.why[g]}</p>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn pri" onclick="setTarget('${r.id}')">${t('setTarget')}</button></div>`;
};

function roadmapSteps(r, scen = S.scenario){
  const s = score(r, scen);
  // missing skills first, then by trend momentum under this scenario
  return s.parts.filter(p=>p.credit<1)
    .sort((a,b)=> (a.has-b.has) || (priority(b.l,scen)-priority(a.l,scen))).map(p=>p.l);
}
V.roadmap = () => {
  const r = ROLES.find(x=>x.id===(S.target||'bi-analyst'));
  const steps = roadmapSteps(r);
  const shown = S.assessed ? steps : steps.slice(0,2);
  const hours = steps.reduce((a,l)=>a+SKILLS[l].h,0);
  const free = steps.filter(l=>SKILLS[l].c[1]==='Free').length;
  return `<h1>${t('roadmap')}: ${r.title}</h1>
  <p class="lead">Ordered by gaps first, then by how fast each skill is rising under the <b>${S.scenario}</b> scenario. Every course below is a real listing with a link.</p>
  ${!S.assessed?`<div class="banner b-warn"><div><b>Preview only.</b> The full personalised roadmap unlocks after the proficiency assessment, because the order depends on your actual levels.</div><button class="btn sm pri" onclick="go('assess')">Complete assessment</button></div>`:''}
  <div class="grid g3" style="margin-bottom:10px">
   <div class="card"><div class="tiny muted">Total time ${tag('calc','Calculated')}</div><div class="big">~${hours} h</div><div class="tiny muted">study estimate from skill table</div></div>
   <div class="card"><div class="tiny muted">Free courses</div><div class="big">${free} / ${steps.length}</div><div class="tiny muted">${free===steps.length?'no fees on this path':'the rest are low-cost e-LATiH listings'}</div></div>
   <div class="card"><div class="tiny muted">Match after plan ${tag('est','Estimate')}</div><div class="big">${r0(score(r).fit)}% → 100%</div><div class="tiny muted">if every step is completed</div></div>
  </div>
  <div class="card">${shown.map((l,i)=>{const c=SKILLS[l].c, st=S.progress[l]||'todo';
   return `<div class="step ${st==='done'?'done':''}"><div class="k">${st==='done'?'✓':i+1}</div><div>
    <div class="row" style="justify-content:space-between"><b>${l}</b><span class="row">${r.skills.includes(l)&&S.profile.skills[l]?tag('self','Improve'):tag('bad','New skill')}<span class="tiny muted">≈ ${SKILLS[l].h} h</span></span></div>
    <p class="small muted">Why: required for ${r.title}; AI-research mentions ${growth(l)>=0?'up':'down'} ${Math.abs(r0(growth(l)))}% (2024→25)${SKILLS[l].ai&&S.scenario==='fast'?' · moved up under Fast AI':''}.</p>
    <p class="small" style="margin-top:4px">📘 <a href="${c[3]}" target="_blank" rel="noopener">${c[0]}</a> · <b>${c[1]}</b> · ${c[2]} · e-LATiH (HRD Corp) <span class="tiny muted">checked 24 Oct 2026</span></p>
    <div class="row tiny" style="margin-top:6px">${['todo','started','done'].map(v=>`<button class="btn sm ${st===v?'pri':''}" onclick="S.progress['${l}']='${v}';render()">${v==='todo'?'Not started':v==='started'?'In progress':'Completed (self-reported)'}</button>`).join('')}</div>
   </div></div>`;}).join('')}
   ${!S.assessed && steps.length>2?`<p class="small muted" style="padding-top:12px">🔒 ${steps.length-2} more steps hidden until the assessment is done.</p>`:''}
  </div>
  ${S.access!=='account'?`<p class="tiny muted" style="margin-top:10px">Progress is saved in this browser. <a href="#" onclick="go('save');return false">Create an account</a> to keep it across devices.</p>`:''}
  <div class="row" style="margin-top:14px"><button class="btn pri" onclick="go('sdg')">See SDG contribution →</button></div>
  ${hint('Stage 4 of 6. Judges can click any course link to check it is real. Courses come from data/skills.json, never from a language model.')}`;
};

V.sdg = () => {
  const r = ROLES.find(x=>x.id===(S.target||'bi-analyst'));
  const steps = roadmapSteps(r);
  const tally = {};
  r.sdg.forEach(g=>tally[g]=(tally[g]||0)+1);
  steps.forEach(l=>SKILLS[l].sdg.forEach(g=>tally[g]=(tally[g]||0)+1));
  const max = Math.max(...Object.values(tally));
  const alt = ROLES.filter(x=>x.id!==r.id && x.sdg.some(g=>!r.sdg.includes(g)));
  return `<h1>${t('sdg')}</h1>
  <p class="lead">How your chosen career and learning steps connect to the UN Sustainable Development Goals. This is <b>potential contribution</b>, not measured impact.</p>
  <div class="grid g2">
   <div class="card"><h3>Your pathway: ${r.title}</h3><p class="tiny muted">Links counted from the role (1 each) and every roadmap skill.</p>
    ${Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between">${sdgB(g)}<span class="small">${n} link${n>1?'s':''}</span></div><div class="bar" style="margin-top:4px"><i style="width:${n/max*100}%;background:${SDG[g].c}"></i></div><div class="tiny muted">Target ${SDG[g].t}</div></div>`).join('')}
   </div>
   <div class="card"><h3>Why each link exists</h3>
    ${r.sdg.map(g=>`<p class="small" style="margin:8px 0"><b>Role → SDG ${g}:</b> ${r.why[g]}</p>`).join('')}
    ${steps.map(l=>`<p class="small" style="margin:8px 0"><b>${l} → ${SKILLS[l].sdg.map(g=>'SDG '+g).join(', ')}:</b> ${SKILLS[l].sdg.includes(9)?'a digital skill that strengthens local technology capability (9.5)':SKILLS[l].sdg.includes(8)?'raises workplace productivity (8.2)':'lifelong learning toward decent work (4.4)'}.</p>`).join('')}
   </div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Does the SDG link change your choice?</h3>
   <p class="small muted">You said you care about ${S.profile.sdgPref.map(g=>'SDG '+g).join(' and ')}. Roles that share your goals get up to +10 rank points (shown in each score breakdown).</p>
   ${alt.length?`<p class="small" style="margin-top:6px">Want a different impact? ${alt.map(x=>`<b>${x.title}</b> (${x.sdg.map(g=>'SDG '+g).join(', ')}, match ${r0(score(x).fit)}%) <button class="btn sm ghost" onclick="S.viewRole='${x.id}';go('role')">view</button>`).join(' · ')}</p>`:''}
   <div class="row small" style="margin-top:8px">My SDG interests: ${Object.keys(SDG).map(g=>`<label class="chip" style="padding-right:12px"><input type="checkbox" ${S.profile.sdgPref.includes(+g)?'checked':''} onchange="toggleSdg(${g})"> SDG ${g}</label>`).join('')}</div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn pri" onclick="go('futures')">Compare futures →</button></div>
  ${hint('Stage 5 of 6. SDG test: untick SDG 9 — BI and Data Analyst lose their bonus and Digital Learning (SDG 4) moves up in Career matching. Remove the tags and the user loses information.')}`;
};
function toggleSdg(g){ const p=S.profile.sdgPref; S.profile.sdgPref = p.includes(g)?p.filter(x=>x!==g):[...p,g]; render(); }

V.futures = () => {
  const a = ranked('moderate'), b = ranked('fast');
  const r = ROLES.find(x=>x.id===(S.target||'bi-analyst'));
  const sa = roadmapSteps(r,'moderate'), sb = roadmapSteps(r,'fast');
  const note = sa.join()===sb.join() ? 'Same order in both futures: AI-linked skills get a bigger boost under Fast AI, but not enough to reorder this plan. The role outlook above is what moves.' : '';
  return `<h1>${t('futures')}</h1>
  <div class="banner b-est"><div><b>These are estimates, not predictions.</b> Each scenario applies one explicit parameter — how much of a role’s automatable work is actually automated — to the same sourced trend data. Nobody knows which future will happen.</div></div>
  <div class="row" style="margin-bottom:14px"><div class="seg"><button class="${S.scenario==='moderate'?'on':''}" onclick="S.scenario='moderate';render()">Moderate AI adoption (×0.6)</button><button class="${S.scenario==='fast'?'on':''}" onclick="S.scenario='fast';render()">Fast AI adoption (×1.0)</button></div><span class="tiny muted">Active scenario is used on every screen.</span></div>
  <div class="card" style="overflow-x:auto"><table>
   <tr><th>Role</th><th class="num">Current Skill Match</th><th class="num">Outlook · Moderate</th><th class="num">Outlook · Fast</th><th class="num">Rank M → F</th></tr>
   ${a.map(({r:x,s},i)=>{const j=b.findIndex(y=>y.r.id===x.id), so=score(x,'fast'); const d=so.outlook-s.outlook;
     return `<tr><td>${x.title}</td><td class="num">${r0(s.fit)}% <span class="tiny muted">same</span></td><td class="num">${r0(s.outlook)}</td><td class="num">${r0(so.outlook)} <span class="${d<0?'down':'muted'} tiny">${d<0?'▼'+Math.abs(r0(d)):'='}</span></td><td class="num">#${i+1} → #${j+1}${j>i?' <span class="down">▼</span>':j<i?' <span class="up">▲</span>':''}</td></tr>`}).join('')}
  </table><p class="tiny muted" style="margin-top:8px">Current Skill Match does not change: your skills and the role’s requirements are the same in both futures. Only the role outlook moves.</p></div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>What changed and why</h3><ul class="small" style="padding-left:18px">
    ${a.filter(({r:x})=>x.auto>=30).map(({r:x})=>`<li><b>${x.title}</b>: ${x.auto}% of tasks are automatable, so its outlook falls by ${r0(0.5*x.auto*0.4)} points under Fast AI.</li>`).join('')}
    <li>Roles with few automatable tasks (e.g. Digital Transformation, ${ROLES.find(x=>x.id==='digital-transformation').auto}%) hold steady.</li></ul></div>
   <div class="card"><h3>Roadmap order (${r.title})</h3>${note?`<p class="tiny muted">${note}</p>`:''}<div class="grid g2 small">
    <div><b>Moderate</b><ol style="padding-left:18px">${sa.map(l=>`<li>${l}</li>`).join('')}</ol></div>
    <div><b>Fast</b><ol style="padding-left:18px">${sb.map(l=>`<li>${l}${SKILLS[l].ai?' '+tag('est','↑ AI-linked'):''}</li>`).join('')}</ol></div></div></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn pri" onclick="go(S.access==='account'?'dash':'save')">Save my career plan →</button></div>
  ${hint('Stage 6 of 6. Scenarios are computed from SCENARIO_FACTOR, not hand-written alternatives.')}`;
};

V.save = () => {
  const opts = [['A','Keep my existing account profile','Load the account profile. Your guest exploration stays on this device until you decide.'],
    ['B','Replace my existing profile','The guest profile replaces the account one. Asks you to confirm first.'],
    ['C','Save as another career plan','Keep both. This exploration becomes Plan 2 in the same account.'],
    ['D','Merge selected information','Compare side by side and pick what to keep.']];
  return `<h1>${t('save')}</h1><p class="lead">Keep your plan safe and use it on any device. You can also keep exploring as a guest.</p>
  <div class="grid g2">
   <div class="card"><h3>New account</h3><p class="small muted">After sign-up we’ll ask before moving your guest profile, assessment, plan and progress into the account.</p>
    <button class="btn pri" style="margin-top:10px" onclick="if(confirm('Transfer this guest profile, assessment, plan and progress to your new account?')){S.access='account';S.signedIn=true;S.sync='cloud';go('dash')}">${t('create')} and transfer</button></div>
   <div class="card"><h3>I already have an account</h3><p class="small muted">Your account already has a plan (“Data Analyst”, 3 of 6 steps done). We won’t overwrite anything without asking.</p>
    <div class="grid" style="margin-top:10px">${opts.map(([k,n,d])=>`<button class="choice ${S.saveChoice===k?'sel':''}" style="padding:10px 12px" onclick="S.saveChoice='${k}';render()"><b>${k} · ${n}</b><span class="tiny muted">${d}</span></button>`).join('')}</div></div>
  </div>
  ${S.saveChoice==='D'?`<div class="card" style="margin-top:14px"><h3>Merge: choose what to keep</h3><table>
   <tr><th>Item</th><th>This guest session</th><th>Your account</th></tr>
   <tr><td>Job</td><td><label><input type="radio" name="m1" checked> IT support executive</label></td><td><label><input type="radio" name="m1"> IT support executive</label></td></tr>
   <tr><td>SQL level</td><td><label><input type="radio" name="m2" checked> ${S.profile.skills['SQL and databases']||'unknown'} (${S.levelSrc['SQL and databases']==='quiz'?'assessed':'self'})</label></td><td><label><input type="radio" name="m2"> basic (self, Jun 2026)</label> ${tag('bad','Conflict')}</td></tr>
   <tr><td>Learning progress</td><td colspan="2"><label><input type="checkbox" checked> Keep both — completed steps are never deleted</label></td></tr></table>
   <button class="btn pri" style="margin-top:10px" onclick="S.access='account';S.signedIn=true;S.sync='cloud';go('dash')">Save merged profile</button></div>`:''}
  ${S.saveChoice&&S.saveChoice!=='D'?`<div class="row" style="margin-top:14px"><button class="btn pri" onclick="if(${S.saveChoice==='B'}?confirm('Replace your existing account profile? Its saved plan will be archived, not deleted.'):true){S.access='account';S.signedIn=true;S.sync='cloud';go('dash')}">Confirm option ${S.saveChoice}</button></div>`:''}`;
};

V.dash = () => {
  const r = ROLES.find(x=>x.id===(S.target||'bi-analyst')), steps = roadmapSteps(r);
  const done = steps.filter(l=>S.progress[l]==='done').length;
  return `<h1>${t('dash')}</h1><p class="lead">Welcome back. Language and plans loaded from your account.</p>
  <div class="banner b-info"><div><b>Plan needs review.</b> Trend data was refreshed on 26 Oct 2026 (OpenDOSM). Your BI Analyst outlook may have changed. Your progress is kept.</div><button class="btn sm" onclick="go('match')">Review recommendations</button></div>
  <div class="grid g3">
   <div class="card"><div class="tiny muted">Plan 1 · target</div><h3>${r.title}</h3><div class="bar" style="margin:8px 0"><i style="width:${steps.length?done/steps.length*100:0}%"></i></div><div class="small muted">${done} of ${steps.length} steps completed</div><button class="btn sm" style="margin-top:8px" onclick="go('roadmap')">Open roadmap</button></div>
   <div class="card"><div class="tiny muted">Plan 2 · saved earlier</div><h3>Data Analyst</h3><div class="bar" style="margin:8px 0"><i style="width:50%"></i></div><div class="small muted">3 of 6 steps completed</div></div>
   <div class="card"><div class="tiny muted">Profile</div><h3>${S.profile.name}</h3><div class="small muted">${Object.keys(S.profile.skills).length} skills · ${S.assessed?'assessed':'assessment pending'}</div><button class="btn sm" style="margin-top:8px" onclick="go('confirm')">Update profile</button></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>Notifications</h3><label class="small"><input type="checkbox" checked> Tell me when trend data changes my plan</label><br><label class="small"><input type="checkbox"> Monthly progress reminder</label></div>
   <div class="card"><h3>My data</h3><p class="small muted">Stored: profile, plans, progress, language. Raw CV files are not stored. (PDPA)</p><div class="row" style="margin-top:8px"><button class="btn sm">Download my data</button><button class="btn sm" style="color:var(--bad)">Delete my account data</button></div></div>
  </div>`;
};

/* ---------- Router ---------- */
function go(id){
  if (id!=='recovery') S.resumeTo = id;
  S.screen = id; S.sync==='cloud' ? syncPulse() : null; persist(); render(); window.scrollTo(0,0);
}
function syncPulse(){ const p=document.getElementById('savePill'); p.className='pill warn'; p.textContent=t('syncing'); setTimeout(()=>savePill(),600); }
function savePill(){ const p=document.getElementById('savePill'); if(!S.access){p.className='pill';p.textContent='Not saved yet';return;} p.className='pill ok'; p.textContent = S.sync==='cloud'?'☁ '+t('savedCloud'):'💾 '+t('savedLocal'); }
function setLang(l){ S.lang=l; document.documentElement.lang = l==='zh'?'zh':l; persist(); render(); }
function flash(msg){ document.querySelector('main').insertAdjacentHTML('afterbegin',`<div class="banner b-ok"><div>${msg}</div></div>`); window.scrollTo(0,0); }
function render(){
  document.getElementById('langSel').value = S.lang;
  // once a profile exists the user moves freely between these sections
  const tabIds = ['radar','match','roadmap','sdg','futures'];
  const onTab = S.screen==='role' ? 'match' : S.screen;
  const tabs = tabIds.includes(onTab) ? `<div class="tabs">${tabIds.map((id,i)=>`<button class="${onTab===id?'on':''}" onclick="go('${id}')"><span class="n">${i+2}</span>${t(id)}</button>`).join('')}<button onclick="go('confirm')">${t('confirm')}</button></div>` : '';
  const legend = `<div class="foot row">Labels: ${tag('src','Sourced')} ${tag('calc','Calculated')} ${tag('est','Estimate')} ${tag('self','Self-reported')} ${tag('prov','Provisional')} ${tag('unv','Unverified')} <span>· Mockup with synthetic user “Aina”; data snapshots from the repo (Oct 2026). No language model is used in this mockup.</span></div>`;
  document.getElementById('main').innerHTML = tabs + V[S.screen]() + legend;
  savePill();
}

/* ---------- Boot: returning-guest detection ---------- */
const saved = load();
if (saved && saved.screen && saved.screen!=='welcome'){ S = Object.assign(fresh(), saved); S.resumeTo = saved.screen; S.screen='recovery'; }
else S = saved ? Object.assign(fresh(), saved) : fresh();
render();
</script>
</body>
</html>
